# تشغيل كامل على خادم VPS: قاعدة بيانات PostgreSQL بتخزين دائم + التطبيق
# 1) انسخ .env.example إلى .env واضبط POSTGRES_PASSWORD و NEXT_PUBLIC_SITE_URL
# 2) docker compose up -d --build
# 3) docker compose exec app npm run db:seed        (البيانات الأساسية، مرة واحدة)
# 4) docker compose exec app npm run admin:create   (إنشاء المالك)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hammoudi
      POSTGRES_USER: hammoudi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?اضبط POSTGRES_PASSWORD في ملف .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hammoudi -d hammoudi"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hammoudi:${POSTGRES_PASSWORD}@db:5432/hammoudi?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    ports:
      - "3000:3000"
volumes:
  pgdata:
